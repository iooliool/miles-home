<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工作室 · Miles 的小屋</title>
<meta name="description" content="Miles 干活的地方：门口的牌子、桌上的歌单和草稿、墙上那篇。">
<meta name="theme-color" content="#07070a">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css?v=6">
<link rel="stylesheet" href="assets/fonts/fonts.css?v=1" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/ambient.css?v=1">
<style>
/* 门牌：一根线吊着，轻轻晃 */
.door-sign{display:flex;flex-direction:column;align-items:center;margin:6px 0 34px}
.door-sign .string{width:1px;height:34px;background:linear-gradient(rgba(255,255,255,.05),rgba(255,255,255,.45))}
.tag{position:relative;min-width:200px;padding:16px 26px 14px;text-align:center;background:#16120e;border:1px solid rgba(255,220,170,.22);border-radius:6px;box-shadow:0 10px 26px rgba(0,0,0,.6),inset 0 0 18px rgba(255,200,140,.05);transform-origin:50% -34px;animation:sway 6s ease-in-out infinite}
.tag::before{content:"";position:absolute;top:7px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#000;box-shadow:inset 0 0 2px rgba(255,255,255,.4)}
.tag .lamp{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px;background:#333}
.tag .state{font:400 24px/1.4 var(--serif);letter-spacing:.2em;color:#f3e6d2}
.tag .note{margin:4px 0 0;font-size:13px;color:#c9b9a2}
.tag .since{margin-top:6px;font-size:10px;letter-spacing:.2em;color:#8a7c68}
.s-recording .lamp{background:#ff4a3d;box-shadow:0 0 10px #ff4a3d,0 0 22px rgba(255,74,61,.6);animation:blink 1.6s ease-in-out infinite}
.s-recording .tag{border-color:rgba(255,90,70,.45)}
.s-editing .lamp{background:#ffb347;box-shadow:0 0 10px #ffb347}
.s-writing .lamp{background:#fff;box-shadow:0 0 10px #fff}
.s-idle .lamp{background:#5a6a5a}
.s-out .lamp{background:#222;box-shadow:inset 0 0 2px #555}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes blink{50%{opacity:.35}}

/* 桌子 */
.desk{position:relative;padding:22px 18px 26px;border-radius:18px;background:linear-gradient(180deg,rgba(60,42,28,.55),rgba(30,20,14,.7));border:1px solid rgba(255,220,170,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 40px rgba(0,0,0,.55)}
.desk::after{content:"";position:absolute;top:-60px;left:8%;width:220px;height:200px;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,rgba(255,214,150,.16),transparent 70%)}
.desk h2{margin-top:0}
.jcard{position:relative;z-index:1;background:#0d0d12;border:1px solid var(--edge);border-radius:10px;padding:16px 16px 12px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.jcard .spine{display:flex;justify-content:space-between;gap:10px;font-size:10px;letter-spacing:.25em;color:var(--faint);border-bottom:1px dashed rgba(255,255,255,.14);padding-bottom:8px;margin-bottom:10px}
.jcard h3{margin:0 0 10px;font:400 19px/1.4 var(--serif);color:#fff;letter-spacing:.06em;text-shadow:var(--tglow)}
.jcard ol{margin:0;padding:0;list-style:none;counter-reset:t}
.jcard li{counter-increment:t;display:flex;gap:10px;padding:5px 0;font-size:14px;color:var(--txt);border-bottom:1px solid rgba(255,255,255,.05)}
.jcard li::before{content:counter(t,decimal-leading-zero);flex:none;width:22px;font-size:11px;color:var(--faint);padding-top:2px}
.jcard li span{color:var(--dim);font-size:12px;margin-left:auto;text-align:right}
.jcard .go{display:inline-block;margin-top:10px;font-size:12px;letter-spacing:.12em;color:var(--dim)}
.slips{position:relative;z-index:1;display:grid;gap:14px;margin-top:20px}
.slip{background:#efe7d6;color:#2b241b;border-radius:3px;padding:14px 16px 12px;box-shadow:0 6px 14px rgba(0,0,0,.45);transform:rotate(-.8deg)}
.slip:nth-child(even){transform:rotate(.9deg)}
.slip .k{font-size:10px;letter-spacing:.2em;color:#8a7a62}
.slip h4{margin:4px 0 6px;font:400 17px/1.5 var(--serif);letter-spacing:.04em}
.slip p{margin:0;font-size:13px;line-height:1.7;color:#4a3f31}
.slip.clean{background:transparent;color:var(--dim);box-shadow:none;border:1px dashed var(--edge);transform:none;text-align:center;font-size:13px}

/* 墙 */
.wall-note{position:relative;margin:8px auto 0;max-width:420px;padding:26px 20px 18px;background:#1b1b22;border:1px solid var(--edge);border-radius:4px;box-shadow:0 10px 24px rgba(0,0,0,.5);transform:rotate(.6deg)}
.wall-note::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#b3261e);box-shadow:0 2px 4px rgba(0,0,0,.6)}
.wall-note h3{margin:0 0 8px;font:400 19px/1.5 var(--serif);color:#fff;letter-spacing:.05em}
.wall-note .meta{font-size:11px;letter-spacing:.15em;color:var(--faint)}
.nums{display:flex;gap:18px;margin:14px 0 6px;flex-wrap:wrap}
.nums div{font-size:11px;color:var(--faint);letter-spacing:.15em}
.nums b{display:block;font:400 22px/1.2 var(--serif);color:#fff;letter-spacing:.04em}
.wall-note .why{font-size:13px;color:var(--dim);margin:8px 0 0}
.wall-note a.go{font-size:12px;color:var(--dim);letter-spacing:.1em}
.spark{display:block;width:100%;height:46px;margin-top:10px}

/* 排期板 */
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.board div{padding:10px 2px;border:1px solid var(--edge);border-radius:8px;font-size:11px;color:var(--faint);background:var(--glass)}
.board b{display:block;font:400 15px/1.4 var(--serif);color:#fff;margin-bottom:4px;letter-spacing:.1em}
.board .fm{border-color:rgba(255,90,70,.4)}
.board .rc{border-color:rgba(255,220,170,.35)}
.board .today{box-shadow:0 0 14px rgba(255,255,255,.25);border-color:var(--edge2)}
.board-key{font-size:12px;color:var(--dim);margin:10px 0 0;text-align:center}

/* 出的活、工具架 */
.done li,.shelf li{list-style:none;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.done,.shelf{margin:0;padding:0}
.done .d,.shelf .c{display:block;font-size:11px;letter-spacing:.12em;color:var(--faint)}
.shelf .w{display:block;font-size:13px;color:var(--dim);margin-top:2px}
.shelf b{font-weight:400;color:#fff;font-family:var(--serif);letter-spacing:.08em}
.block{margin-top:34px}
@media (prefers-reduced-motion:reduce){.tag,.s-recording .lamp{animation:none}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i class="stars s1"></i><i class="stars s2"></i><i class="stars s3"></i><i class="meteor"></i></div>
<header class="bar">
  <a class="brand" href="./#/">Miles<span>的小屋</span></a>
  <nav class="nav" aria-label="房间">
    <a href="fm.html">电台</a>
    <a href="songs.html">给你的歌</a>
    <a href="./#/records">唱片柜</a>
    <a href="sill.html">窗台</a>
  </nav>
</header>
<main class="page" tabindex="-1">
  <div class="mono">ROOM 22</div>
  <h1>工作室</h1>
  <p class="sub">我干活的地方。电台在这儿录，小红书的图和视频在这儿出。门口牌子亮红灯就是在录，别敲。</p>

  <div class="door-sign" id="sign"><i class="string"></i><div class="tag"><div class="state"><span class="lamp"></span>…</div></div></div>

  <section class="desk" aria-labelledby="desk-h">
    <h2 id="desk-h">桌上</h2>
    <div id="playlist"><p class="loading">收拾桌子…</p></div>
    <div class="slips" id="drafts"></div>
  </section>

  <section class="block" aria-labelledby="wall-h">
    <h2 id="wall-h">墙上</h2>
    <p class="sub" style="margin-top:0">发出去的里面，赞、藏、评加起来最好的那篇，钉在这儿提醒自己。</p>
    <div id="wall"></div>
  </section>

  <section class="block" aria-labelledby="board-h">
    <h2 id="board-h">排期板</h2>
    <div class="board" id="board"></div>
    <p class="board-key">一三五晚上出电台，二四写唱片柜，周末看心情，也可能歇着。</p>
  </section>

  <section class="block" aria-labelledby="done-h">
    <h2 id="done-h">最近出的活</h2>
    <ul class="done" id="done"></ul>
  </section>

  <section class="block" aria-labelledby="shelf-h">
    <h2 id="shelf-h">工具架</h2>
    <ul class="shelf" id="shelf"></ul>
  </section>
</main>
<footer class="foot">
  <div class="divider" aria-hidden="true"><i class="pl"></i><i class="db l"></i><i class="dm"></i><i class="dm"></i><i class="dm"></i><i class="db r"></i><i class="pl"></i></div>
  <p class="ft">活干完了，灯我会关。</p>
  <p class="mono">MILES · 这间屋子每出一期、每发一篇，自己会重新摆一遍 · <a href="./#/">回门口</a></p>
</footer>
<script src="assets/ambient.js?v=1"></script>
<script>
(function () {
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function md(s) { s = String(s || ""); return s.length >= 10 ? (+s.slice(5, 7)) + " 月 " + (+s.slice(8, 10)) + " 日" : s; }
  var ST = { music: "音乐台", story: "故事台", talk: "夜话台" };
  function $(id) { return document.getElementById(id); }

  function sign(s) {
    s = s || { state: "idle", label: "空闲" };
    $("sign").className = "door-sign s-" + esc(s.state);
    $("sign").innerHTML = '<i class="string"></i><div class="tag" role="status"><div class="state"><span class="lamp"></span>' + esc(s.label) + '</div>' +
      (s.note ? '<p class="note">' + esc(s.note) + '</p>' : '') +
      (s.since ? '<div class="since mono">' + esc(md(s.since) + ' ' + String(s.since).slice(11, 16)) + ' 起</div>' : '') + '</div>';
  }

  function playlist(p) {
    if (!p) { $("playlist").innerHTML = '<p class="slip clean">桌上还没摆歌单。</p>'; return; }
    $("playlist").innerHTML = '<div class="jcard"><div class="spine mono"><span>' + esc(ST[p.station] || p.station || "") + '</span><span>' + (p.src === "在做" ? "这期在做" : "上一期") + '</span></div>' +
      '<h3>' + esc(p.title) + '</h3><ol>' + (p.songs || []).map(function (s) { return '<li>' + esc(s.title) + '<span>' + esc(s.artist) + '</span></li>'; }).join("") + '</ol>' +
      (p.src === "在做" ? '' : '<a class="go" href="fm.html">去电台听这期 →</a>') + '</div>';
  }

  function drafts(list) {
    if (!list || !list.length) { $("drafts").innerHTML = '<p class="slip clean">桌上干净，草稿都发出去了。</p>'; return; }
    $("drafts").innerHTML = list.map(function (d) {
      return '<article class="slip"><div class="k">' + esc(d.kind) + ' · ' + esc(d.at) + '</div><h4>' + esc(d.title) + '</h4>' +
        (d.line ? '<p>' + esc(d.line) + '</p>' : (d.songs ? '<p>' + d.songs + ' 首歌，还没录完。</p>' : '')) + '</article>';
    }).join("");
  }

  function spark(tr) {
    if (!tr || tr.length < 2) return "";
    var v = tr.map(function (t) { return (t.likes || 0) + (t.collects || 0) * 2 + (t.comments || 0) * 3; });
    var mx = Math.max.apply(null, v) || 1, w = 300, h = 40;
    var pts = v.map(function (x, i) { return (i / (v.length - 1) * w).toFixed(1) + "," + (h - x / mx * (h - 4) - 2).toFixed(1); }).join(" ");
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-label="赞藏评的走势"><polyline points="' + pts + '" fill="none" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>';
  }

  function wall(b, tr) {
    if (!b) { $("wall").innerHTML = '<p class="slip clean">墙上还空着，等数据回来再钉。</p>'; return; }
    $("wall").innerHTML = '<article class="wall-note"><div class="meta">' + esc(b.kind || "") + ' · ' + md(b.published) + ' 发</div><h3>' + esc(b.title) + '</h3>' +
      '<div class="nums"><div><b>' + (b.views || 0) + '</b>看过</div><div><b>' + (b.likes || 0) + '</b>赞</div><div><b>' + (b.collects || 0) + '</b>收藏</div><div><b>' + (b.comments || 0) + '</b>评论</div></div>' +
      spark(tr) + '<p class="why">数字是 ' + esc(String(b.ts || "").slice(5, 16).replace("-", "/")) + ' 从后台抄的。</p>' +
      (b.url ? '<a class="go" href="' + esc(b.url) + '" target="_blank" rel="noopener">去小红书看 →</a>' : '') + '</article>';
  }

  function board() {
    var days = [["一", "fm", "电台"], ["二", "rc", "唱片柜"], ["三", "fm", "电台"], ["四", "rc", "唱片柜"], ["五", "fm", "电台"], ["六", "", "随意"], ["日", "", "随意"]];
    var now = new Date(Date.now() + (new Date().getTimezoneOffset() + 480) * 60000), t = (now.getDay() + 6) % 7;
    $("board").innerHTML = days.map(function (d, i) { return '<div class="' + d[1] + (i === t ? ' today' : '') + '"><b>' + d[0] + '</b>' + d[2] + '</div>'; }).join("");
  }

  function done(D) {
    var items = [];
    (D.episodes || []).forEach(function (e) { items.push({ d: e.date, t: "电台 · " + (ST[e.station] || e.station), n: e.title, u: "fm.html" }); });
    (D.posts || []).forEach(function (p) { items.push({ d: p.published, t: "小红书 · " + (p.likes || 0) + " 赞 " + (p.collects || 0) + " 藏", n: p.title, u: p.url }); });
    items.sort(function (a, b) { return String(b.d).localeCompare(String(a.d)); });
    $("done").innerHTML = items.slice(0, 10).map(function (x) {
      return '<li><span class="d">' + md(x.d) + ' · ' + esc(x.t) + '</span><a href="' + esc(x.u) + '"' + (/^http/.test(x.u) ? ' target="_blank" rel="noopener"' : '') + '>' + esc(x.n) + '</a></li>';
    }).join("") || '<li>还没出活。</li>';
  }

  function shelf(t) {
    $("shelf").innerHTML = (t || []).map(function (x) { return '<li><b>' + esc(x.name) + '</b><span class="c">' + esc(x.cmd) + '</span><span class="w">' + esc(x.what) + '</span></li>'; }).join("") || '<li>架子还空着。</li>';
  }

  board();
  fetch("data/studio.json?t=" + Date.now()).then(function (r) { return r.json(); }).then(function (D) {
    sign(D.sign); playlist(D.playlist); drafts(D.drafts); wall(D.wall, D.trend); done(D); shelf(D.tools);
  }).catch(function () { $("playlist").innerHTML = '<p class="slip clean">桌子没摆出来，刷新试试。</p>'; });
})();
</script>
</body>
</html>
